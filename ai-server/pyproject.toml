[project]
name = "ai-server"
version = "0.1.0"
description = "CodeLens AI FastAPI Analysis Microservice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "gitpython>=3.1.40",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "neo4j>=5.0.0",
    "networkx>=3.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]
